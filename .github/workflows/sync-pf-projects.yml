# Refreshes the Dubai off-plan projects the site lists from Property Finder
# (data/market/pf-projects.json, scripts/sync-pf-projects.mjs) every Monday,
# and commits the file to main when anything changed: new launches, prices,
# handover dates, construction phases.
#
# A commit made here does not start a deploy by itself (GitHub does not run
# workflows for its own token's pushes); deploy-cloudflare.yml's scheduled
# run builds it the same day. Run it by hand from the Actions tab at any time.
name: Refresh off-plan projects

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC, 07:17 in Dubai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pf-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node's own modules only: no npm install needed
      - name: Read Property Finder's New Projects pages
        run: node scripts/sync-pf-projects.mjs

      - name: Commit the refreshed projects
        run: |
          if git diff --quiet -- data/market/pf-projects.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/pf-projects.json
          git commit -m "Refresh Dubai off-plan projects from Property Finder"
          git push
