# Builds the site and deploys it to Cloudflare Workers (OpenNext).
#
# Runs on every push to main, when the D|R|P portal asks for a rebuild
# (repository_dispatch "rebuild": hourly from Supabase pg_cron, and after a
# listing is saved), and on GitHub's own hourly schedule as a fallback, so the
# site shows Property Finder's and the portal's current listings, and the
# current Dubai property news (scripts/sync-news.mjs). GitHub runs
# scheduled workflows late when it is busy, so the schedule is a safety net,
# not the quick path.
#
# A rebuild request or a scheduled run first fetches the listings (half a
# minute) and builds only when they differ from the last deploy, or once a day
# for the DLD sales and nearby places. That keeps the hourly checks cheap enough for the
# 2,000 free Actions minutes a month of a private repository.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"),
#              PF_API_KEY, PF_API_SECRET
#   Variables: CLOUDFLARE_ACCOUNT_ID, NEXT_PUBLIC_SITE_URL,
#              LISTINGS_FEED_URL, PF_LIVE_ONLY (optional),
#              NEXT_PUBLIC_TURNSTILE_SITE_KEY (optional, the forms' bot check)
# Runtime secrets (RESEND_API_KEY, PORTAL_API_KEY, ...) are set on the Worker
# in the Cloudflare dashboard; deploys keep them.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rebuild]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

# One deploy at a time; a newer request waits rather than cancelling a deploy halfway.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

env:
  LISTINGS_FEED_URL: ${{ vars.LISTINGS_FEED_URL }}
  PF_LIVE_ONLY: ${{ vars.PF_LIVE_ONLY }}
  PF_API_KEY: ${{ secrets.PF_API_KEY }}
  PF_API_SECRET: ${{ secrets.PF_API_SECRET }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      key: ${{ steps.fingerprint.outputs.key }}
    steps:
      - name: Check the Cloudflare token is set
        id: setup
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set yet; nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      # The sync scripts use Node's standard library only: no npm ci needed.
      - name: Fetch the listings and fingerprint them
        id: fingerprint
        if: steps.setup.outputs.ready == 'true'
        run: |
          node scripts/sync-property-finder.mjs
          node scripts/sync-listings.mjs
          node scripts/sync-news.mjs
          sum=$(cat data/imported/listings.json data/imported/pf-photos.json data/imported/clean-photos.json \
            data/imported/portal-listings.json data/imported/hidden-listings.json data/imported/portal-team.json \
            <(node -p "JSON.stringify(require('./data/imported/news.json').picks ?? [])") \
            | sha256sum | cut -c1-16)
          echo "key=deployed-$(date -u +%F)-$sum" >> "$GITHUB_OUTPUT"

      - name: Look for a deploy of these listings today
        id: seen
        if: steps.setup.outputs.ready == 'true' && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule')
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.setup.outputs.ready }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then
            echo "Listings unchanged since today's last deploy; nothing to rebuild."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Next's build cache and the nearby-places cache (scripts/sync-nearby.mjs)
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ github.run_id }}
          restore-keys: next-cache-

      - run: npm ci

      - name: Build (listings sync runs first, in prebuild) and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # Remembers these listings as deployed, so the hourly checks skip them until they change.
      - name: Mark the listings as deployed
        run: mkdir -p .deployed && echo "${{ github.run_id }}" > .deployed/run

      - uses: actions/cache/save@v4
        with:
          path: .deployed
          key: ${{ needs.check.outputs.key }}
